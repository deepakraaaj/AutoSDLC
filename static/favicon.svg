<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Background -->
  <rect width="64" height="64" fill="#0F172A" rx="8"/>
  
  <!-- Main shape: stylized A with workflow arrows -->
  <g fill="none" stroke="#3B82F6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left arrow -->
    <path d="M 12 32 L 20 32"/>
    <path d="M 16 28 L 20 32 L 16 36"/>
    
    <!-- Central box (automation/processing) -->
    <rect x="24" y="20" width="16" height="24" fill="#1E3A8A" stroke="#3B82F6"/>
    
    <!-- Processing lines inside -->
    <line x1="28" y1="26" x2="36" y2="26" stroke="#60A5FA" stroke-width="1.5"/>
    <line x1="28" y1="32" x2="36" y2="32" stroke="#60A5FA" stroke-width="1.5"/>
    <line x1="28" y1="38" x2="36" y2="38" stroke="#60A5FA" stroke-width="1.5"/>
    
    <!-- Right arrow -->
    <path d="M 44 32 L 52 32"/>
    <path d="M 48 28 L 52 32 L 48 36"/>
  </g>
  
  <!-- Bottom accent: cycle indicator -->
  <circle cx="32" cy="54" r="3" fill="#3B82F6" opacity="0.8"/>
  <circle cx="26" cy="52" r="2" fill="#3B82F6" opacity="0.5"/>
  <circle cx="38" cy="52" r="2" fill="#3B82F6" opacity="0.5"/>
</svg>
